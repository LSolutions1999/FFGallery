<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faceted Frames | Gallery</title>
    <meta
      name="description"
      content="Official Faceted Frames Website Gallery"
    />
    <link rel="icon" type="image/jpeg" href="../assets/fflogo.jpg" />
    <link rel="stylesheet" href="../styles.css?v=20260903" />
  </head>
  <body class="gallery-page">
    <header class="site-header">
      <a class="header-logo-link" href="../index.html" aria-label="Back to home">
        <img class="header-banner" src="../assets/fftextlogo.PNG" alt="Faceted Frames logo" />
      </a>
      <div class="header-overlay">
        <div class="topbar-left">
          <a class="top-link shop-link" href="../index.html">
            <img class="nav-image nav-image-home" src="../assets/homeicongold.png" alt="Home" />
          </a>
          <a class="top-link desktop-contact-link" href="#bottom">
            <img class="nav-image nav-image-contact" src="../assets/contacticongold.png" alt="Contact" />
          </a>
          <nav class="mobile-header-links mobile-header-links--left" aria-label="Mobile page links">
            <a class="mobile-header-link mobile-header-link--switch" href="../index.html" aria-label="Home">
              <img src="../assets/homeicongold.png" alt="" />
            </a>
            <a class="mobile-header-link mobile-header-link--contact" href="#bottom" aria-label="Contact">
              <img src="../assets/contacticongold.png" alt="" />
            </a>
          </nav>
        </div>
        <div class="header-right">
          <nav class="mobile-header-links mobile-header-links--right" aria-label="Mobile social links">
            <a class="mobile-header-link" href="https://www.youtube.com/@facetedframes" target="_blank" rel="noreferrer" aria-label="YouTube">
              <img src="../assets/youtubegold.png" alt="" />
            </a>
            <a class="mobile-header-link" href="https://www.facebook.com/profile.php?id=61569752854311&ref=NONE_xav_ig_profile_page_web" target="_blank" rel="noreferrer" aria-label="Facebook">
              <img src="../assets/FBgold.png" alt="" />
            </a>
            <a class="mobile-header-link" href="https://www.instagram.com/facetedframes/" target="_blank" rel="noreferrer" aria-label="Instagram">
              <img src="../assets/instagramgold.png" alt="" />
            </a>
          </nav>
          <div class="desktop-socials desktop-socials--right" aria-label="Social links">
            <a class="desktop-social-link" href="https://www.youtube.com/@facetedframes" target="_blank" rel="noreferrer" aria-label="YouTube">
              <img src="../assets/youtubegold.png" alt="" />
            </a>
            <a class="desktop-social-link" href="https://www.facebook.com/profile.php?id=61569752854311&ref=NONE_xav_ig_profile_page_web" target="_blank" rel="noreferrer" aria-label="Facebook">
              <img src="../assets/FBgold.png" alt="" />
            </a>
            <a class="desktop-social-link" href="https://www.instagram.com/facetedframes/" target="_blank" rel="noreferrer" aria-label="Instagram">
              <img src="../assets/instagramgold.png" alt="" />
            </a>
          </div>
        </div>
      </div>
    </header>
    <main id="top">
      <section class="hero gallery-hero">
        <div class="hero-content">
          <h1 class="hero-title">
            <img class="hero-title-image" src="../assets/ffgallerytext.png" alt="Gallery" />
          </h1>
          <p class="hero-subtitle">
            A curated collection of unique pieces,
            <br />
            made to be explored up close.
          </p>
          <div class="hero-category-menu">
            <button
              class="hero-button hero-category-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="gallery-hero-category-panel"
            >
              <span>Categories</span>
              <img class="hero-category-chevron" src="../assets/downchevron.png" alt="" aria-hidden="true" />
            </button>
            <div class="section-menu-panel hero-category-panel" id="gallery-hero-category-panel" hidden></div>
          </div>
        </div>
      </section>

      <section id="gallery-collection" class="content-section section-frame gallery-section">
        <div class="gallery-sections" aria-label="Gallery collection"></div>
      </section>

      <section id="contact" class="contact-section">
        <div class="section-shell">
          <p class="eyebrow">Contact</p>
          <div class="contact-actions">
            <div class="contact-pair">
              <div class="contact-item">
                <p class="contact-item-title">Commissions, Inquires,<br />and Questions</p>
                <a class="contact-email-button" href="mailto:facetedframes@gmail.com?subject=Commissions">
                  General Correspondence
                </a>
              </div>
              <div class="contact-item">
                <p class="contact-item-title">Curating Exhibitions<br />and Events</p>
                <a class="contact-email-button" href="mailto:facetedframesvending@gmail.com?subject=Vending">
                  Curation Proposals
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div id="bottom" aria-hidden="true"></div>
    </main>

    <script src="../assets/gallery-images.js?v=20260903"></script>
    <script type="module" src="../assets/gallery-page.js?v=20260903"></script>
  </body>
</html>
